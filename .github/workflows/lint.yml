name: Lint
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test scan comments
        run: bash scripts/test.sh
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: actionlint
        uses: raven-actions/actionlint@v2
